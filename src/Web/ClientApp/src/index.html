         Roboto Mono 400 for values. Roboto itself is gone — Material now takes
         its plain and brand families from _material-theme.scss.

         Only these four faces, because three families unrestrained is ~180 kB
         and a flash of unstyled text on every first visit, which lands on the
         public marketplace where it costs conversion. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Poppins:wght@500&family=Roboto+Mono:wght@400&display=swap" rel="stylesheet">
