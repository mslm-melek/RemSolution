<span class="avatar" [class.avatar-lg]="size === 'lg'" *transloco="let t">
  <!-- The face read off the client's CIN. Already a square crop centred on the
       head, so cover only absorbs the rounding. -->
  <img *ngIf="portraitUrl" [src]="portraitUrl"
       [alt]="name ? t('client.portraitOf', { name: name }) : t('client.portrait')"
       loading="lazy" />

  <!-- No photograph on file. aria-hidden: the silhouette says nothing a reader
       needs to hear, and the client's name is already beside it. -->
  <svg *ngIf="!portraitUrl" class="avatar-default" viewBox="0 0 40 40"
       aria-hidden="true" focusable="false">
    <circle cx="20" cy="15" r="7" />
    <path d="M6.5 40a13.5 13.5 0 0 1 27 0Z" />
  </svg>
</span>
