<div class="model-car-card mat-elevation-z4" *transloco="let t">
  <div class="header-row">
    <h2 class="title">{{ t('modelCar.title') }}</h2>
    <a mat-raised-button color="primary" [routerLink]="['/model-car/new']">
      <mat-icon>add</mat-icon> {{ t('modelCar.new') }}
    </a>
  </div>

  <!-- Filters -->
  <div class="filter-row">
    <mat-form-field appearance="outline" class="filter-field">
      <mat-label>{{ t('modelCar.brand') }}</mat-label>
      <mat-select [(ngModel)]="filterBrandId" (selectionChange)="onFilter()">
        <mat-option [value]="null">{{ t('modelCar.allBrands') }}</mat-option>
        <mat-option *ngFor="let brand of brands" [value]="brand.id">
          {{ brand.name }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <button mat-button (click)="clearFilters()">{{ t('common.clear') }}</button>
  </div>

  <!-- Material Table -->
  <table mat-table [dataSource]="modelCars" class="mat-elevation-z2 full-width">

    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>{{ t('common.name') }}</th>
      <td mat-cell *matCellDef="let modelCar">{{ modelCar.name }}</td>
    </ng-container>

    <ng-container matColumnDef="brand">
      <th mat-header-cell *matHeaderCellDef>{{ t('modelCar.brand') }}</th>
      <td mat-cell *matCellDef="let modelCar">{{ modelCar.brandName }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef class="text-center">{{ t('common.actions') }}</th>
      <td mat-cell *matCellDef="let modelCar" class="text-center">
        <a mat-icon-button color="primary" [routerLink]="['/model-car', modelCar.id]" [attr.aria-label]="t('common.edit')">
          <mat-icon>edit</mat-icon>
        </a>
        <button mat-icon-button color="warn" (click)="deleteModelCar(modelCar)" [attr.aria-label]="t('common.delete')">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell empty-row" [attr.colspan]="displayedColumns.length">{{ t('modelCar.empty') }}</td>
    </tr>
  </table>

  <!-- Server-side paginator -->
  <mat-paginator [length]="totalCount"
                 [pageIndex]="pageNumber - 1"
                 [pageSize]="pageSize"
                 [pageSizeOptions]="[5, 10, 25, 50]"
                 (page)="onPage($event)">
  </mat-paginator>
</div>
