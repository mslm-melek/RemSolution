<div class="et-card mat-elevation-z4">
  <div class="header-row">
    <h2 class="title">Expense Types</h2>
  </div>

  <div *ngIf="errorMessage" class="error-banner">{{ errorMessage }}</div>

  <div class="inline-add">
    <mat-form-field appearance="outline">
      <mat-label>Name</mat-label>
      <input matInput [(ngModel)]="name" placeholder="e.g. Oil change" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>After km</mat-label>
      <input matInput type="number" min="1" [(ngModel)]="afterKilometer" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>After months</mat-label>
      <input matInput type="number" min="1" [(ngModel)]="afterMonth" />
    </mat-form-field>
    <mat-checkbox [(ngModel)]="withNotif">Notify</mat-checkbox>
    <mat-checkbox *ngIf="editingId" [(ngModel)]="isActive">Active</mat-checkbox>
    <button mat-raised-button color="primary" (click)="save()">
      <mat-icon>{{ editingId ? 'save' : 'add' }}</mat-icon> {{ editingId ? 'Save' : 'Add' }}
    </button>
    <button mat-stroked-button *ngIf="editingId" (click)="resetForm()">Cancel</button>
  </div>

  <table mat-table [dataSource]="types" class="mat-elevation-z2 full-width">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let t">{{ t.name }}</td>
    </ng-container>

    <ng-container matColumnDef="schedule">
      <th mat-header-cell *matHeaderCellDef>Due</th>
      <td mat-cell *matCellDef="let t">
        <span *ngIf="t.afterKilometer">every {{ t.afterKilometer }} km</span>
        <span *ngIf="t.afterKilometer && t.afterMonth"> / </span>
        <span *ngIf="t.afterMonth">every {{ t.afterMonth }} mo</span>
      </td>
    </ng-container>

    <ng-container matColumnDef="notify">
      <th mat-header-cell *matHeaderCellDef>Notify</th>
      <td mat-cell *matCellDef="let t">{{ t.withNotif ? 'Yes' : 'No' }}</td>
    </ng-container>

    <ng-container matColumnDef="active">
      <th mat-header-cell *matHeaderCellDef>Active</th>
      <td mat-cell *matCellDef="let t">{{ t.isActive ? 'Yes' : 'No' }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef class="text-center">Actions</th>
      <td mat-cell *matCellDef="let t" class="text-center">
        <button mat-icon-button color="primary" (click)="edit(t)" aria-label="Edit">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" *ngIf="t.isActive" (click)="deactivate(t)" aria-label="Deactivate">
          <mat-icon>block</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell empty-row" [attr.colspan]="displayedColumns.length">No types defined.</td>
    </tr>
  </table>
</div>
