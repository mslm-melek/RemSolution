<div class="agency-card mat-elevation-z4" *transloco="let t">
  <div class="header-row">
    <h2 class="title">{{ t('agency.carsReadOnly') }}</h2>
    <a mat-button [routerLink]="['/agency', agencyId]">
      <mat-icon>arrow_back</mat-icon> {{ t('agency.backToAgency') }}
    </a>
  </div>

  <table mat-table [dataSource]="cars" class="mat-elevation-z2 full-width">
    <ng-container matColumnDef="matricule">
      <th mat-header-cell *matHeaderCellDef>{{ t('car.matricule') }}</th>
      <td mat-cell *matCellDef="let car">{{ car.matricule }}</td>
    </ng-container>
    <ng-container matColumnDef="model">
      <th mat-header-cell *matHeaderCellDef>{{ t('car.model') }}</th>
      <td mat-cell *matCellDef="let car">{{ car.modelName }}</td>
    </ng-container>
    <ng-container matColumnDef="branch">
      <th mat-header-cell *matHeaderCellDef>{{ t('car.branch') }}</th>
      <td mat-cell *matCellDef="let car">{{ car.branchName }}</td>
    </ng-container>
    <ng-container matColumnDef="color">
      <th mat-header-cell *matHeaderCellDef>{{ t('car.color') }}</th>
      <td mat-cell *matCellDef="let car">{{ car.color }}</td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell empty-row" [attr.colspan]="displayedColumns.length">{{ t('car.empty') }}</td>
    </tr>
  </table>

  <mat-paginator [length]="totalCount"
                 [pageIndex]="pageNumber - 1"
                 [pageSize]="pageSize"
                 [pageSizeOptions]="[5, 10, 25, 50]"
                 (page)="onPage($event)">
  </mat-paginator>
</div>
