<div class="page clients" *transloco="let t">
  <div class="header-row">
    <div>
      <h2 class="title">{{ t('client.title') }}</h2>
      <p class="page-subtitle">{{ t('common.resultCount', { count: totalCount }) }}</p>
    </div>
    <a mat-raised-button color="primary" [routerLink]="['/client/new']">
      <mat-icon>person_add</mat-icon> {{ t('client.new') }}
    </a>
  </div>

  <!-- What the last late notice did. An outcome, not an error: "no email on file"
       and "already sent today" both belong here. -->
  <div *ngIf="noticeMessage" class="info-banner">
    <mat-icon>outgoing_mail</mat-icon> {{ noticeMessage }}
    <button mat-icon-button (click)="noticeMessage = ''" [attr.aria-label]="t('common.clear')">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- ================================ TOOLBAR ================================
       One box over name, email and CIN — whichever of the three the counter has
       in front of them (see GetClientsWithPaginationQuery) — then the standing
       strip, then the order. -->
  <div class="filter-row client-toolbar">
    <form class="client-search" (ngSubmit)="onSearch()">
      <mat-icon>search</mat-icon>
      <input type="search" name="q" [(ngModel)]="search"
             [placeholder]="t('client.searchPlaceholder')"
             [attr.aria-label]="t('client.searchByName')" />
      <button type="button" class="search-clear" *ngIf="search" (click)="clearSearch()"
              [attr.aria-label]="t('common.clear')">
        <mat-icon>close</mat-icon>
      </button>
    </form>

    <!-- Where each client stands, as the one question the book is filtered by:
         everyone, papers on file, papers still to collect, flagged. The buttons
         write the URL like every other filter does (see selectPill). -->
    <div class="standing-strip" role="group" [attr.aria-label]="t('client.standing.label')">
      <button type="button" class="standing-pill" [class.active]="pill === 'all'"
              [attr.aria-pressed]="pill === 'all'" (click)="selectPill('all')">
        {{ t('common.all') }}
      </button>
      <button type="button" class="standing-pill" [class.active]="pill === 'verified'"
              [attr.aria-pressed]="pill === 'verified'" (click)="selectPill('verified')">
        {{ t('client.standing.verified') }}
      </button>
      <button type="button" class="standing-pill" [class.active]="pill === 'pending'"
              [attr.aria-pressed]="pill === 'pending'" (click)="selectPill('pending')">
        {{ t('client.standing.pending') }}
      </button>
      <button type="button" class="standing-pill" [class.active]="pill === 'flagged'"
              [attr.aria-pressed]="pill === 'flagged'" (click)="selectPill('flagged')">
        {{ t('client.standing.flagged') }}
      </button>
    </div>

    <span class="spacer"></span>

    <!-- The cards have no headers to click, so the order lives here. It is still
         the server's order (see SortingExtensions), not a reshuffle of the page
         already on screen. -->
    <button type="button" class="tool-btn" [matMenuTriggerFor]="sortMenu"
            [matTooltip]="t('booking.sortBy')">
      <mat-icon>sort</mat-icon>
      <span class="tool-btn-text">{{ t(activeSortLabelKey) }}</span>
      <mat-icon class="tool-dir">{{ sortDirection === 'desc' ? 'arrow_downward' : 'arrow_upward' }}</mat-icon>
    </button>
    <mat-menu #sortMenu="matMenu">
      <button mat-menu-item type="button" *ngFor="let option of sortOptions"
              (click)="sortByKey(option.key)">
        <mat-icon>
          {{ sortBy === option.key
               ? (sortDirection === 'desc' ? 'arrow_downward' : 'arrow_upward')
               : 'sort' }}
        </mat-icon>
        {{ t(option.labelKey) }}
      </button>
    </mat-menu>
  </div>

  <!-- Filters this list was opened with that no control above stands for. -->
  <div class="filter-chips" *ngIf="chips.length">
    <span class="chip no-dot" *ngFor="let chip of chips">
      {{ t(chip.labelKey, chip.labelArgs) }}
      <button type="button" class="chip-clear" (click)="clearChip(chip)"
              [matTooltip]="t('filters.clear')" [attr.aria-label]="t('filters.clear')">
        <mat-icon>close</mat-icon>
      </button>
    </span>
  </div>

  <!-- ================================= CARDS =================================
       The bar in the leading gutter means "settle this before you hand over a
       car" (see rule 1 in docs/DESIGN_SYSTEM.md): amber where a paper is still
       to be collected, red where the agency has flagged the client. A client in
       good standing gets no bar, which is what makes the gutter worth scanning.
       The standing itself is the chip on the right. -->
  <div class="client-list">
    <article class="client-card" *ngFor="let row of rows"
             [class.needs-action]="row.standing !== 'verified'"
             [class.is-overdue]="row.standing === 'flagged'">
      <!-- The card body is the way in: clicking anywhere that is not a button
           opens the client beside the list. -->
      <button type="button" class="client-open" (click)="open(row)"
              [attr.aria-label]="t('client.openClient', { name: row.name })">
        <app-client-avatar [client]="row.client"></app-client-avatar>

        <span class="client-who">
          <span class="client-name">{{ row.name }}</span>
          <span class="client-sub">
            <span class="num" *ngIf="row.client.cin">{{ row.client.cin }}</span>
            <span *ngIf="row.client.cin && row.client.email"> · </span>
            <span class="client-email" *ngIf="row.client.email">{{ row.client.email }}</span>
            <mat-icon *ngIf="row.client.hasPortalAccount" class="account-icon"
                      [matTooltip]="t('client.accountActive')">verified_user</mat-icon>
          </span>
        </span>

        <span class="client-stat">
          <span class="client-stat-label">{{ t('client.rentings') }}</span>
          <span class="client-stat-value num">{{ row.client.rentingCount ?? 0 }}</span>
          <span class="client-stat-note" *ngIf="row.client.openRentingCount">
            {{ t('client.openRentings', { count: row.client.openRentingCount }) }}
          </span>
        </span>

        <!-- Only where there is a debt: a column of dashes for everyone who owes
             nothing says less than an empty space does. -->
        <span class="client-money">
          <span class="chip danger" *ngIf="outstanding(row.client) as debt">
            {{ debt.outstanding?.amount | number:'1.2-2' }} {{ debt.outstanding?.currency }}
          </span>
        </span>

        <span class="client-standing">
          <span class="chip" [ngClass]="row.standingClass">
            <mat-icon>{{ row.standingIcon }}</mat-icon>
            {{ t(row.standingLabelKey) }}
          </span>
        </span>
      </button>

      <div class="client-actions">
        <!-- Straight into the booking wizard with this client already chosen. -->
        <a *ngIf="canRent" mat-icon-button color="primary"
           [routerLink]="['/renting/new']" [queryParams]="{ clientId: row.client.id }"
           [matTooltip]="t('client.rentTo')" [attr.aria-label]="t('client.rentTo')">
          <mat-icon>vpn_key</mat-icon>
        </a>
        <!-- Only where there is something to write about: a client with every car
             back has nothing to be reminded of (see ClientDto.OverdueRentingCount). -->
        <button *ngIf="canRemind && row.late" mat-icon-button color="warn"
                (click)="remindLate(row)"
                [matTooltip]="t('lateNotice.action')" [attr.aria-label]="t('lateNotice.action')">
          <mat-icon>outgoing_mail</mat-icon>
        </button>
      </div>
    </article>

    <p class="empty-row" *ngIf="!rows.length">{{ t('client.empty') }}</p>
  </div>

  <!-- Server-side paginator -->
  <mat-paginator [length]="totalCount"
                 [pageIndex]="pageNumber - 1"
                 [pageSize]="pageSize"
                 [pageSizeOptions]="[5, 10, 25, 50]"
                 (page)="onPage($event)">
  </mat-paginator>
</div>
