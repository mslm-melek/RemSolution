<div class="page brand-card" *transloco="let t">
  <div class="header-row">
    <h2 class="title">{{ t('brand.title') }}</h2>
  </div>

  <!-- Add Brand Row -->
  <div class="add-row">
    <mat-form-field appearance="outline" class="brand-input">
      <mat-label>{{ t('brand.newBrandName') }}</mat-label>
      <input matInput [(ngModel)]="newBrand" [placeholder]="t('brand.namePlaceholder')" />
      <mat-error *ngIf="errorMessage">{{ errorMessage }}</mat-error>

    </mat-form-field>

    <button mat-raised-button color="primary" (click)="addBrand()" [disabled]="!newBrand.trim()">
      <mat-icon>add</mat-icon> {{ t('common.add') }}
    </button>
  </div>

  <!-- Material Table -->
  <!-- The API returns the whole catalog, so the sort runs on the client. -->
  <table mat-table [dataSource]="dataSource" class="data-table full-width" matSort matSortDisableClear>

    <!-- Name Column -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>{{ t('brand.brandName') }}</th>
      <td mat-cell *matCellDef="let brand"><span class="cell-main">{{ brand.name }}</span></td>
    </ng-container>

    <!-- Delete Column -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef class="actions-cell">{{ t('common.actions') }}</th>
      <td mat-cell *matCellDef="let brand" class="actions-cell row-actions">
        <button mat-icon-button color="warn" (click)="deleteBrand(brand)" [attr.aria-label]="t('common.delete')">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>

  <mat-paginator [pageSize]="5"></mat-paginator>
</div>
